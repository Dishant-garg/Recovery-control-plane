# Compliance policy. Read by rcp/compliance/*.
#
# Versioned because every decision records which rules produced it
# (decisions.policy_version). Changing a rule here without bumping the version
# makes the audit log ambiguous about what was in force.

version: policy-v1

# The sim clock is UTC. Contact-hour rules are local. See rcp/timeutil.py.
timezone_offset_minutes: 330      # IST, UTC+05:30

quiet_hours:
  start_hour: 21                  # 21:00 local
  end_hour: 9                     # until 09:00 local
  # A silent rail retry is not an intrusion, and neither is an inbox. Only
  # things that make a phone buzz are restricted.
  exempt_channels: [retry, email]
  # Shift rather than deny -- a message worth sending at 10pm is still worth
  # sending at 9am, and denying it discards real recovery value over timing.
  action: shift

# Ceilings on top of the global contact cap in config/scoring.yaml. A customer
# can be within the overall cap and still be getting called too often.
channel_sub_caps:
  window_days: 7
  max:
    voice: 1
    whatsapp: 2

consent:
  # Commercial contact on these channels requires recorded opt-in.
  require_opt_in: [whatsapp, voice]
  # Never overridable, by any rule or score.
  honor_opt_out: true

promise_to_pay:
  # An accepted promise buys silence. Chasing someone who already committed to
  # a date is how a recovery flow turns into harassment.
  grace_days: 2
  max_active: 1
  broken_cooldown_days: 7

incentive:
  max_paise: 20000                # Rs 200 absolute ceiling
  max_pct_of_amount: 15           # and never more than 15% of what is owed

# --- escalation ------------------------------------------------------------
# The ladder owns channel order, and that is what makes escalation *compliant*
# rather than ad hoc. A proposer picking whatever channel it liked each time
# could reach for voice on the first attempt; a ladder cannot. Cheapest and
# least intrusive first, so the expensive and intrusive rungs are only reached
# by a case that has genuinely earned them. See ADR-008.
escalation:
  ladder:
    subscription: [retry, sms, whatsapp, voice]
    cart:         [retry, retry, sms, whatsapp]
    receivables:  [retry, email, voice]

  # Minimum gap between rungs. Escalating a customer twice in one day is how a
  # recovery flow becomes harassment regardless of what the contact cap allows.
  cooldown_days: 3

  # A retry is silent, so it does not need the same breathing room as a message.
  retry_cooldown_days: 1

# --- stopping rules --------------------------------------------------------
# Knowing when to give up is half of what separates recovery from harassment,
# and it is the half nobody builds. Every rule here closes a case with a written
# reason (see cases.close), so "why did we stop chasing this" is answerable.
stopping:
  max_attempts: 4

  # Below this expected value, the case is written off rather than chased. The
  # arbiter's per-action floor asks "is this action worth it"; this asks the
  # bigger question, "is this case worth anyone's time at all".
  min_expected_value_paise: 2000        # Rs 20

  # Stale debt: past this age recovery odds are negligible and continued
  # contact is pure cost.
  write_off_after_days: 45

  # A broken promise is a signal, not a licence to chase harder.
  broken_promise_cooldown_days: 7

  # Never overridable by any score, agent, or policy.
  hard_stop_on_opt_out: true

channel_eligibility:
  # Retrying these fails identically every time -- it burns the rail and tells
  # the customer nothing. subscription.py already declines to do it; this rule
  # is what makes it a guarantee rather than good manners. See ADR-005.
  deny_retry_for: [mandate_expired, card_expired, invalid_account]
